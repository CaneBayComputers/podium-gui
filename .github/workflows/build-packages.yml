name: Build packages

# Replaces the old build-deb.yml / build-mac.yml, which called
# packaging/build-*.sh — hand-rolled scripts that predate electron-builder and
# broke when the revamp moved the sources under src/ ("cp: *.html: No such file
# or directory"). electron-builder is what produces the shipped packages now,
# so CI runs the same command a maintainer runs locally rather than a parallel
# implementation that can rot without anyone noticing.

on:
  # Deliberately NOT on every push. macOS runners bill at 10x Linux, and the
  # old workflows burned a run on every commit to produce artifacts nobody
  # collected.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: 'Existing release tag to attach artifacts to (blank = artifacts only)'
        required: false
        default: ''

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20 minimum. Ubuntu still ships 18, which is too old for the build
          # tooling — the old workflow pinned 18 and would fail here anyway.
          node-version: '20'
          cache: 'npm'

      # electron-builder shells out to these for the rpm and pacman targets and
      # neither is on the runner by default: rpmbuild for rpm, bsdtar for pacman.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd

      - run: npm ci
      - run: npm run build-ts

      - name: Build deb, rpm and pacman
        run: npx electron-builder --linux deb rpm pacman --publish never

      # electron-builder emits an XZ-compressed .pacman. Current Arch expects
      # zstd, so repack it — only the outer compression changes, .PKGINFO,
      # .MTREE and .INSTALL are preserved exactly, which is what pacman reads.
      - name: Repack pacman as .pkg.tar.zst
        run: |
          set -euo pipefail
          src=$(ls release/*.pacman)
          base=$(basename "$src" .pacman)
          work=$(mktemp -d)
          bsdtar -xf "$src" -C "$work"
          ( cd "$work" && bsdtar -cf - --format=gnutar \
              $(ls -a | grep -vE '^\.\.?$') \
            | zstd -q -19 -T0 -o "$GITHUB_WORKSPACE/release/${base}-x86_64.pkg.tar.zst" )
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build-ts

      # Both architectures rather than a universal binary: node-pty is a native
      # module, and universal builds of native modules are the fiddly case.
      # Two dmgs is less clever and less likely to ship broken.
      - name: Build dmg (arm64 + x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: release/*.dmg

  attach:
    # Publishing the artifacts onto a release is a separate job so a failed
    # build never half-populates a release's download list.
    needs: [linux, macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.attach_to_tag != ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' \) \
            -exec sha256sum {} + | sed 's|\./[a-z-]*/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.attach_to_tag }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.dmg
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-repo:
    # Push the released .deb into the APT repo at packages.podiumcli.com so
    # `apt upgrade` picks it up. Runs only after the release actually has its
    # assets attached — publishing metadata that points at files which are not
    # there yet gives every user a 404 mid-upgrade.
    needs: [attach]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.attach_to_tag != ''
    steps:
      - name: Publish to packages.podiumcli.com
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.attach_to_tag }}
          # Pre-releases go to the `beta` suite so they are not pushed to
          # everyone tracking `stable` by default.
          SUITE: ${{ (github.event_name == 'release' && github.event.release.prerelease == false) && 'stable' || 'beta' }}
          # Passed as env rather than interpolated into the script body:
          # ${{ }} substitutes into the shell text, so a key with awkward
          # characters can break the script or leak into a trace.
          SSH_KEY: ${{ secrets.REPO_PUBLISH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.REPO_PUBLISH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          # The key is pinned server-side to a single forced command and cannot
          # open a shell, but the host key is still pinned here so a hijacked
          # DNS answer cannot collect the secret.
          # OpenSSH rejects a private key with no trailing newline, which is
          # what printf '%s' would produce.
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "publishing $TAG to suite $SUITE"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
            podiumpub@canebaycomputers.com \
            "CaneBayComputers/podium-gui $TAG $SUITE"

      - name: Verify apt can see it
        run: |
          set -euo pipefail
          SUITE="${{ (github.event_name == 'release' && github.event.release.prerelease == false) && 'stable' || 'beta' }}"
          # Assert the repo actually serves what we just published, rather than
          # trusting the publish step's exit code.
          curl -fsSL "https://packages.podiumcli.com/dists/$SUITE/InRelease" | head -3
          curl -fsSL "https://packages.podiumcli.com/dists/$SUITE/main/binary-amd64/Packages" \
            | grep -E '^(Package|Version):' | head -4
